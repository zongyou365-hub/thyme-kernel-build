name: Build thyme 4.19.325 (SukiSU+KPM)

on:
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: "SukiSU branch (susfs_new = best 4.19 compat + KPM)"
        default: "susfs_new"
        type: string
      target:
        description: "make target"
        default: "Image"
        type: string
      localversion:
        description: "CONFIG_LOCALVERSION (must match installed module vermagic)"
        default: "-HyperOS3-A16-Sky-Developers"
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --force || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache clang flex git \
            libc6-dev libelf-dev libncurses5-dev libncurses-dev \
            libssl-dev lld llvm zip curl wget unzip \
            python3 python-is-python3 cpio \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          clang --version | head -2 || true

      - name: Clone kernel source (HuTao77 thyme 16.0 / 4.19.325)
        run: |
          git clone --depth=1 -b 16.0 \
            https://github.com/HuTao77-Studio/android_kernel_xiaomi_thyme.git kernel
          cd kernel
          echo "=== strip localversion-cip / -st (scripts/setlocalversion appends them) ==="
          ls -la localversion-* 2>/dev/null || true
          rm -f localversion-cip localversion-st
          echo "=== HEAD ==="
          git log -1 --format="%H %cd %s"
          echo "=== Version ==="
          head -6 Makefile
          echo "=== defconfig ==="
          ls -la arch/arm64/configs/thyme_defconfig
          echo "=== base key configs ==="
          grep -E "CONFIG_(LOCALVERSION|MODVERSIONS|MODULE_SIG|CGROUP_BPF|IKCONFIG)" arch/arm64/configs/thyme_defconfig
          echo "=== cgroup.c structure ==="
          grep -n "purge_effective_progs\|update_effective_progs" kernel/bpf/cgroup.c | head -8

      - name: Download toolchain (AOSP LLVM clang r547379 = same as M13)
        run: |
          set -e
          mkdir -p "$HOME/tc" && cd "$HOME/tc"
          echo "=== trying android.googlesource.com ==="
          curl -fsSL --retry 3 --max-time 600 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz" \
            -o clang.tar.gz || \
          curl -fsSL --retry 3 --max-time 600 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-release/clang-r547379.tar.gz" \
            -o clang.tar.gz
          ls -la clang.tar.gz
          mkdir -p clang && tar -xzf clang.tar.gz -C clang
          export PATH="$HOME/tc/clang/bin:$PATH"
          clang --version | head -3
          ld.lld --version | head -1

      - name: Patch vendor hooks build
        run: |
          cd kernel
          ls -la drivers/android/vendor_hooks.c 2>/dev/null || echo "(no vendor_hooks.c)"
          if [ -f drivers/android/vendor_hooks.c ] && ! grep -q "vendor_hooks" drivers/android/Makefile; then
            echo "obj-y += vendor_hooks.o" >> drivers/android/Makefile
            echo ">> patched vendor_hooks.o"
          fi
          tail -3 drivers/android/Makefile

      - name: Patch DRM msm_drv strnstr (2-arg call, 4.19 needs 3)
        run: |
          cd kernel
          echo "=== before ==="
          sed -n '1230,1240p' drivers/gpu/drm/msm/msm_drv.c
          sed -i 's/strnstr(dev_name(dev), "mdp")/strstr(dev_name(dev), "mdp")/' drivers/gpu/drm/msm/msm_drv.c
          echo "=== after ==="
          grep -n "strstr(dev_name" drivers/gpu/drm/msm/msm_drv.c
          echo "=== scan other suspicious 2-arg strnstr ==="
          grep -rn "strnstr(" drivers/gpu techpack 2>/dev/null | grep -vE "strnstr\([^,]+, *[^,]+, *[^)]+\)" | head -10 || true

      - name: Integrate SukiSU (manual clone, no setup.sh)
        run: |
          cd kernel
          BR="${{ inputs.ksu_branch }}"
          [ -z "$BR" ] && BR="susfs_new"
          rm -rf KernelSU drivers/kernelsu
          git clone --depth=1 -b "$BR" https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          echo "=== repo state ==="
          git -C KernelSU log -1 --format="%H %cd %s"
          git -C KernelSU rev-parse --abbrev-ref HEAD
          echo "=== KernelSU/kernel/ ==="
          ls KernelSU/kernel/ | head -30
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          ls -la drivers/kernelsu | head -3
          echo "=== Kconfig items ==="
          grep -E "^config " drivers/kernelsu/Kconfig | awk '{print $2}' | tr '\n' ' '; echo
          echo "=== wire into Kbuild ==="
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          # NOTE: setup.sh uses `sed /endmenu/i`, which nests the source inside an unrelated
          # menu block -> CONFIG_KSU silently disappears from .config. Append at EOF instead.
          sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig
          printf '\nsource "drivers/kernelsu/Kconfig"\n' >> drivers/Kconfig
          grep -n "kernelsu" drivers/Kconfig drivers/Makefile | head -4
          echo "=== tail of drivers/Kconfig ==="
          tail -4 drivers/Kconfig
          echo "=== KPM sources ==="
          ls KernelSU/kernel/kpm/ 2>/dev/null | head -10 || echo "(no kpm dir)"
          echo "=== Makefile CFLAGS health check ==="
          if grep -qE "^(CFLAGS|AFLAGS)[[:space:]]*[:+]?=" drivers/kernelsu/Makefile; then
            sed -i 's/^CFLAGS[[:space:]]*:=/ccflags-y :=/; s/^CFLAGS[[:space:]]*+=/ccflags-y +=/; s/^AFLAGS[[:space:]]*:=/asflags-y :=/; s/^AFLAGS[[:space:]]*+=/asflags-y +=/' drivers/kernelsu/Makefile
            echo "patched CFLAGS -> ccflags-y"
          else
            echo "Makefile clean"
          fi
          echo "=== KPM: 4.19 access_ok() takes 3 args (type, addr, size) ==="
          if [ -f drivers/kernelsu/kpm/kpm.c ]; then
            sed -i 's/access_ok(\([^,)]*\), \([^)]*\))/access_ok(VERIFY_WRITE, \1, \2)/g' drivers/kernelsu/kpm/kpm.c
            grep -n "access_ok" drivers/kernelsu/kpm/kpm.c | head -12
          else
            echo "(no kpm.c)"
          fi

      - name: Configure
        id: cfg
        run: |
          cd kernel
          make O=out ARCH=arm64 thyme_defconfig
          # --- merge Xiaomi platform fragments (MANDATORY) ---
          # thyme_defconfig alone lacks CONFIG_MACH_XIAOMI_THYME / QCA_CLD_WLAN / CMDLINE /
          # touch / charger / fingerprint etc. Booting without these hangs before pstore init.
          ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/vendor/xiaomi/sm8250-common.config \
            arch/arm64/configs/vendor/xiaomi/thyme.config
          echo "=== fragment merge check ==="
          grep -E "CONFIG_(MACH_XIAOMI_THYME|QCA_CLD_WLAN|BUILD_ARM64_DT_OVERLAY|CMDLINE|TOUCHSCREEN_ST_FTS_V521)=" out/.config || echo "  !! fragment keys MISSING"
          SC="./scripts/config --file out/.config"
          # --- align with installed vendor modules ---
          $SC --set-str LOCALVERSION "${{ inputs.localversion }}"
          $SC -d LOCALVERSION_AUTO
          $SC -d MODULE_SIG_FORCE
          $SC -e MODULE_SIG
          $SC -e MODVERSIONS
          # --- boot / runtime essentials ---
          # NOTE: DRM_MSM must stay OFF. This tree drives display via techpack/display/msm;
          # enabling drivers/gpu/drm/msm causes duplicate symbols (msm_dss_*, msm_framebuffer_*, ...).
          for opt in DEVTMPFS DEVTMPFS_MOUNT REGULATOR_QCOM_SPMI QCOM_TSENS \
                     ANDROID_VENDOR_HOOKS TRACEPOINTS KALLSYMS KALLSYMS_ALL \
                     IKCONFIG IKCONFIG_PROC PSTORE PSTORE_CONSOLE PSTORE_PMSG PSTORE_RAM; do
            $SC -e "$opt" 2>/dev/null || true
          done
          # --- KernelSU ---
          $SC -d KSU_MODULE 2>/dev/null || true
          $SC -e KSU
          grep -qE "^config KSU_MANUAL_HOOK" drivers/kernelsu/Kconfig && $SC -e KSU_MANUAL_HOOK || echo "(no KSU_MANUAL_HOOK)"
          # --- KPM (builtin branch, default n) ---
          grep -qE "^config KPM" drivers/kernelsu/Kconfig && $SC -e KPM && echo "KPM enabled" || echo "(no KPM in Kconfig)"
          # --- SUSFS: OFF. builtin branch does not bundle <linux/susfs.h>/susfs_def.h,
          #     they come from susfs4ksu and need fs/ patches. Add later once boot works. ---
          $SC -d KSU_SUSFS 2>/dev/null || true
          echo "SUSFS disabled (headers not bundled in builtin branch)"
          make O=out ARCH=arm64 olddefconfig
          echo "=== config verify ==="
          grep -E "CONFIG_(LOCALVERSION|MODULE_SIG_FORCE|MODVERSIONS|DEVTMPFS|DRM_MSM|KSU|KALLSYMS_ALL|IKCONFIG)[= ]" out/.config | grep -v "^#" || true
          echo "--- KSU/SUSFS ---"
          grep -E "CONFIG_(KSU|SUSFS)[A-Z_]*=" out/.config | head -20 || true
          echo "--- MISS check ---"
          for opt in DEVTMPFS KALLSYMS_ALL KSU KPM; do
            grep -q "^CONFIG_$opt=y" out/.config && echo "  OK   $opt" || echo "  MISS $opt"
          done
          echo "--- hard requirement (fail fast) ---"
          for opt in KSU KPM; do
            grep -q "^CONFIG_$opt=y" out/.config || { echo "!! FATAL: CONFIG_$opt=y missing, aborting before 20min build"; exit 1; }
          done
          echo "--- display stack (techpack, DRM_MSM must be off) ---"
          grep -E "CONFIG_(DRM_MSM|TECHPACK|DRM_MSM_SDE)[= ]" out/.config | grep -v "^#" || echo "  DRM_MSM not set (expected)"

      - name: Build Image
        id: build
        run: |
          cd kernel
          export PATH="$HOME/tc/clang/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KBUILD_BUILD_VERSION=1
          export KBUILD_BUILD_USER=builder
          export KBUILD_BUILD_HOST=builder
          clang --version | head -2
          TGT="${{ inputs.target }}"
          [ -z "$TGT" ] && TGT="Image"
          set -o pipefail
          make O=out ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j"$(nproc)" "$TGT" > "build_${TGT}.log" 2>&1 || {
              echo "=== BUILD FAILED ==="
              grep -nE "error:|fatal:|undefined reference|Error [0-9]+|No rule to make target" "build_${TGT}.log" | tail -60
              echo "=== last tasks ==="
              grep -E "^  (CC|LD|AR|GEN|OBJCOPY) " "build_${TGT}.log" | tail -15
              exit 1
            }
          ls -la out/arch/arm64/boot/
          echo "=== version string ==="
          strings out/arch/arm64/boot/$TGT | grep -m2 "Linux version"
          echo "=== vermagic ==="
          strings out/arch/arm64/boot/$TGT | grep -m1 "SMP preempt"
          echo "=== symbol self-check ==="
          for kw in sukisu_kpm_control kpm KernelSU; do
            echo "  $kw = $(strings out/arch/arm64/boot/$TGT | grep -c "$kw")"
          done

      - name: Upload kernel + log
        uses: actions/upload-artifact@v4
        with:
          name: thyme-325-Image
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/build_Image.log
          if-no-files-found: error

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: kernel/build_*.log
          if-no-files-found: ignore
