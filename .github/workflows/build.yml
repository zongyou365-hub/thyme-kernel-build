      - name: Detect defconfig and base config
        id: defc
        run: |
          cd kernel
          DEF=""
          for cand in thyme_defconfig thyme-user_defconfig thyme-perf_defconfig; do
            if [ -f "arch/arm64/configs/$cand" ]; then DEF="$cand"; break; fi
          done
          if [ -z "$DEF" ]; then
            DEF=$(ls arch/arm64/configs/ | grep -i thyme | head -1)
          fi
          if [ -z "$DEF" ]; then
            echo "!! 找不到 thyme defconfig，列出 sm8250 相关:" 
            ls arch/arm64/configs/ | grep -iE "sm8250|vendor" || true
            exit 1
          fi
          echo "defconfig=$DEF" >> "$GITHUB_OUTPUT"
          echo "使用 defconfig: $DEF"
          make O=out ARCH=arm64 "$DEF"
          echo "=== 基线配置关键项 ==="
          grep -E "CONFIG_(KALLSYMS|LOCALVERSION|MODULE)" out/.config | head -10

      - name: Enable KSU / KPM / SUSFS / KALLSYMS
        run: |
          cd kernel
          SC="./scripts/config --file out/.config"
          # 0) Android vendor hooks（drivers/android/vendor_hooks.o 依赖；树引用 android_vh_* 符号）
          $SC -e ANDROID_VENDOR_HOOKS
          $SC -e TRACEPOINTS
          # 0.5) 对齐"可启动基准"（M13/OurSky 共有、defconfig 缺失的 36 项）
          #    关键: XDP_SOCKETS (tethering netbpfload), WIREGUARD, CRYPTO 系列, F2FS 压缩等
          for opt in XDP_SOCKETS WIREGUARD BOARD_XIAOMI CFS_BANDWIDTH FB XLOGCHAR \
                     CRYPTO_842 CRYPTO_LZ4 CRYPTO_LZ4HC CRYPTO_LZO CRYPTO_ZSTD \
                     F2FS_FS_COMPRESSION \
                     PSTORE_COMPRESS PSTORE_DEFLATE_COMPRESS PSTORE_DEFLATE_COMPRESS_DEFAULT \
                     CNSS_QCA6390 \
                     CAN_8DEV_USB CAN_EMS_USB CAN_ESD_USB2 CAN_GS_USB CAN_KVASER_USB \
                     CAN_MCBA_USB CAN_SLCAN CAN_UCAN CAN_VCAN CAN_VXCAN \
                     USB_SERIAL_CH341 USB_SERIAL_OTI6858 USB_SERIAL_PL2303 \
                     USB_SERIAL_QT2 USB_SERIAL_SPCP8X5 USB_SERIAL_TI USB_SERIAL_UPD78F0730; do
            $SC -e "$opt" 2>/dev/null || true
          done
          $SC --set-str PSTORE_COMPRESS_DEFAULT "deflate" 2>/dev/null || true
          # 0.6) 启动必需项（Run#25 实测：内核能编但启动即回落）
          #   本树 drivers/base/Kconfig 把 DEVTMPFS 的 "default y" 删掉了 ->
          #   /dev 为空 -> Android init 无法挂载 devtmpfs -> 静默启动失败
          #   其余为 SM8250(kona) 平台启动/存储/加密必需驱动
          #   注: DRM_MSM 暂不启用 —— Run#26 实测它从未被编译过(msm_drv.c strnstr 2 参 bug)，
          #       先验证 devtmpfs/regulator 这条主线能否让内核起来，显示驱动下一轮单独处理
          BOOT_CFG="DEVTMPFS REGULATOR_QCOM_RPMH REGULATOR_QCOM_SPMI CRYPTO_DEV_QCOM_ICE EROFS_FS UNICODE QCOM_TSENS"
          for opt in $BOOT_CFG; do
            $SC -e "$opt" 2>/dev/null || true
          done
          echo "boot-critical requested: $BOOT_CFG"
          # 1) KALLSYMS（KPM 硬性前提）
          $SC -e KALLSYMS -e KALLSYMS_ALL
          # 2) KernelSU 本体
          $SC -d KSU_MODULE 2>/dev/null || true
          $SC -e KSU
          # 3) non-GKI 手动钩子（4.19 必需；若无此项则忽略）
          grep -qE "^config KSU_MANUAL_HOOK" drivers/kernelsu/Kconfig && $SC -e KSU_MANUAL_HOOK || echo "(no KSU_MANUAL_HOOK in Kconfig)"
          # 4) KPM 源码编译禁用（改用管理器 kpimg 二进制修补路线，规避源码兼容性）
          $SC -d KPM 2>/dev/null || true
          echo "KPM source build disabled (manager kpimg binary patch path used instead)"
          # 5) SUSFS（susfs-main 分支才有）
          for opt in KSU_SUSFS SUSFS; do
            grep -qE "^config $opt" drivers/kernelsu/Kconfig && $SC -e "$opt" && echo "enabled $opt" || true
          done
          # SUSFS 子项全开
          for opt in $(grep -oE "^config KSU_SUSFS_[A-Z_0-9]+" drivers/kernelsu/Kconfig | awk '{print $2}'); do
            $SC -e "$opt" && echo "enabled $opt" || true
          done
          # 6) LOCALVERSION 标记
          $SC --set-str LOCALVERSION "-thyme-SukiSU-KPM"
          make O=out ARCH=arm64 olddefconfig
          echo "=== boot-critical config verify (OK/MISS) ==="
          for opt in $BOOT_CFG; do
            if grep -q "^CONFIG_$opt=y" out/.config; then
              echo "  OK   $opt"
            else
              echo "  MISS $opt -> $(grep -E "^(CONFIG_${opt}=|# CONFIG_${opt} )" out/.config | head -1)"
            fi
          done
          echo "=== 最终配置核验 ==="
          grep -E "CONFIG_(KSU|KPM|KALLSYMS|SUSFS|KSU_MANUAL_HOOK|LOCALVERSION)[=_]" out/.config | grep -v "^#" || true

      - name: Build kernel
        id: build
        run: |
          cd kernel
          export PATH="$HOME/tc/proton-clang/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang LD=ld.lld
          export AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          export KBUILD_BUILD_VERSION=1
          export KBUILD_BUILD_USER=builder
          export KBUILD_BUILD_HOST=builder
          TARGET="${{ inputs.build_target }}"
          [ -z "$TARGET" ] && TARGET="auto"
          set -o pipefail
          build_one() {
            TGT="$1"
            make O=out ARCH=arm64 CC=clang LD=ld.lld \
              AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
              CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              -j"$(nproc)" "$TGT" > "build_full_${TGT}.log" 2>&1
            RC=$?
            echo "=== make $TGT exit=$RC ==="
            if [ $RC -ne 0 ]; then
              echo "=== ERRORS (grep) ==="
              grep -nE "error:|fatal:|undefined reference|Error [0-9]+|No rule to make target|ld\.lld:" "build_full_${TGT}.log" | tail -60 || true
              echo "=== last compiled objects ==="
              grep -E "^  (CC|LD|AR|GEN|OBJCOPY|WRAP) " "build_full_${TGT}.log" | tail -20 || true
              echo "=== tail -40 raw ==="
              tail -40 "build_full_${TGT}.log" || true
            fi
            return $RC
          }
          if [ "$TARGET" = "auto" ] || [ "$TARGET" = "Image.gz-dtb" ]; then
            echo "### 尝试 Image.gz-dtb ###"
            if build_one "Image.gz-dtb"; then
              echo "target=Image.gz-dtb" >> "$GITHUB_OUTPUT"
            else
              echo "### Image.gz-dtb 失败，退回 Image.gz ###"
              build_one "Image.gz" && echo "target=Image.gz" >> "$GITHUB_OUTPUT" || exit 1
            fi
          else
            build_one "$TARGET" && echo "target=$TARGET" >> "$GITHUB_OUTPUT" || exit 1
          fi
          echo "=== 产物 ==="
          ls -la out/arch/arm64/boot/
          echo "=== 内核版本串 ==="
          strings out/arch/arm64/boot/Image* | grep -m1 "Linux version" || true
          echo "=== KPM 符号自检（>0 = KPM 已编入）==="
          for IMG in out/arch/arm64/boot/Image*; do
            if [ -f "$IMG" ]; then
              KC=$(strings "$IMG" | grep -c "sukisu_kpm" || true)
              KP=$(strings "$IMG" | grep -c "KernelPatch" || true)
              echo "$IMG: sukisu_kpm=$KC KernelPatch=$KP"
            fi
          done
          echo "=== SUSFS 符号自检 ==="
          for IMG in out/arch/arm64/boot/Image*; do
            if [ -f "$IMG" ]; then
              SC=$(strings "$IMG" | grep -c "susfs" || true)
              echo "$IMG: susfs=$SC"
            fi
          done

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/.github ak3/README.md ak3/anykernel.sh.bak
          T="${{ steps.build.outputs.target }}"
          if [ "$T" = "Image.gz-dtb" ] && [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb ak3/Image.gz-dtb
            sed -i 's/^BLOCK.*=.*$/BLOCK = auto;/; s|^#.*Image.gz-dtb.*|Image.gz-dtb|' ak3/anykernel.sh || true
          else
            cp kernel/out/arch/arm64/boot/Image.gz ak3/Image.gz
            # dtb 单独打包（若生成）
            if [ -d kernel/out/arch/arm64/boot/dts/qcom ]; then
              find kernel/out/arch/arm64/boot/dts/qcom -name "*.dtb" -exec cp {} ak3/dtb/ \; 2>/dev/null || true
            fi
          fi
          cd ak3
          zip -r9 "../AnyKernel3-thyme-SukiSU-KPM-SUSFS.zip" .
          cd ..
          ls -la AnyKernel3-*.zip

      - name: Also upload raw Image
        run: |
          T="${{ steps.build.outputs.target }}"
          cp "kernel/out/arch/arm64/boot/$T" "./thyme-kernel-${T}-SukiSU-KPM.img" 2>/dev/null || \
            cp kernel/out/arch/arm64/boot/Image "./thyme-kernel-Image-SukiSU-KPM.img"
          ls -la thyme-kernel-*.img || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thyme-kernel-SukiSU-KPM-SUSFS
          path: |
            AnyKernel3-*.zip
            thyme-kernel-*.img
          if-no-files-found: error

      - name: Upload full build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: kernel/build_full_*.log
          if-no-files-found: ignore

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            AnyKernel3-*.zip
            thyme-kernel-*.img
