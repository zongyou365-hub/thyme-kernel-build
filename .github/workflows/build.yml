          QEAKICAgICBraW9jYi0+a2lfZmlscCA9IG9yaWc7CiAgICAgcmV0dXJuIG9yaWctPmZfb3AtPmlv
          cG9sbChraW9jYiwgaWNiLCB2KTsKIH0KLSNlbHNlCisjZWxpZiBMSU5VWF9WRVJTSU9OX0NPREUg
          Pj0gS0VSTkVMX1ZFUlNJT04oNSwgMSwgMCkKIHN0YXRpYyBpbnQga3N1X3dyYXBwZXJfaW9wb2xs
          KHN0cnVjdCBraW9jYiAqa2lvY2IsIGJvb2wgc3BpbikKIHsKICAgICBzdHJ1Y3Qga3N1X2ZpbGVf
          d3JhcHBlciAqZGF0YSA9IGtpb2NiLT5raV9maWxwLT5wcml2YXRlX2RhdGE7CkBAIC0zMDcsNiAr
          MzEzLDcgQEAKIC8vIGh0dHBzOi8vY3MuYW5kcm9pZC5jb20vYW5kcm9pZC9rZXJuZWwvc3VwZXJw
          cm9qZWN0LysvY29tbW9uLWFuZHJvaWQtbWFpbmxpbmU6Y29tbW9uL2ZzL3JlbWFwX3JhbmdlLmM7
          bD00MDMtNDA0O2RyYz0zOThkYTdkZWZlMjE4ZDNlNTFiMGYzYmRmZjc1MTQ3ZTI4MTI1YjYwCiAv
          LyBSRU1BUF9GSUxFX0RFRFVQOiB1c2UgZmlsZV9vdXQKIC8vIGh0dHBzOi8vY3MuYW5kcm9pZC5j
          b20vYW5kcm9pZC9rZXJuZWwvc3VwZXJwcm9qZWN0LysvY29tbW9uLWFuZHJvaWQtbWFpbmxpbmU6
          Y29tbW9uL2ZzL3JlbWFwX3JhbmdlLmM7bD00ODMtNDg0O2RyYz0zOThkYTdkZWZlMjE4ZDNlNTFi
          MGYzYmRmZjc1MTQ3ZTI4MTI1YjYwCisjaWYgTElOVVhfVkVSU0lPTl9DT0RFID49IEtFUk5FTF9W
          RVJTSU9OKDQsIDIwLCAwKQogc3RhdGljIGxvZmZfdCBrc3Vfd3JhcHBlcl9yZW1hcF9maWxlX3Jh
