          NiwgMCkK' | base64 -d > /tmp/fw419.patch
          echo "=== patch preview ==="
          head -6 /tmp/fw419.patch
          echo "=== dry-run ==="
          patch -p1 --batch --dry-run < /tmp/fw419.patch
          echo "=== apply ==="
          patch -p1 --batch < /tmp/fw419.patch
          echo "=== verify ==="
          grep -n "KERNEL_VERSION(4, 20, 0)\|KERNEL_VERSION(5, 1, 0)\|KERNEL_VERSION(5, 10, 0)" drivers/kernelsu/infra/file_wrapper.c | head -12

      - name: Patch SukiSU infra for 4.19 (seccomp cache no-op + su_mount_ns fallback)
