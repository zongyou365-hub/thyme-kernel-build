name: Build thyme kernel (SukiSU + KPM + SUSFS)

on:
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: "SukiSU setup.sh 分支 (susfs_new=官方SUSFS集成 / main / dev)"
        default: "susfs_new"
        type: string
      enable_kpm:
        description: "启用 KPM (CONFIG_KPM=y)"
        default: "true"
        type: string
      build_target:
        description: "编译目标 (Image.gz-dtb / Image.gz / auto)"
        default: "auto"
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --force
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache clang flex git \
            libc6-dev libelf-dev libncurses5-dev libncurses-dev \
            libssl-dev lld llvm zip curl wget unzip \
            python3 python-is-python3 cpio \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          echo "=== clang version ==="
          clang --version | head -2 || true

      - name: Clone kernel source (typezhi/Rinko thyme bloodline tree, 4.19.157)
        run: |
          git clone -b thirteen --filter=blob:none \
            https://github.com/typezhi/Rinko_android_kernel_xiaomi_thyme.git kernel
          cd kernel
          echo "=== HEAD commit ==="
          git log -1 --format="%H %cd %s"
          echo "=== Makefile VERSION ==="
          head -6 Makefile
          echo "=== thyme defconfig 候选 ==="
          ls arch/arm64/configs/ | grep -i thyme || echo "(no thyme-named defconfig)"
          echo "=== cgroup.c 修复前状态 ==="
          grep -c purge_effective_progs kernel/bpf/cgroup.c || true

      - name: Backport note (SKIPPED - arch mismatch)
        run: |
          echo "cgroup-bpf UAF fix chain NOT applied:"
          echo "- 85afe915/50ff8807 target the 2020 'decouple' cgroup_bpf arch (missing in 4.19.157)"
          echo "- 9369ced0/abf096ae target bpf_cgroup_link (missing in 4.19.157)"
          echo "- 157 uses synchronous hierarchical release: the out-of-order UAF path does not exist"
          echo "- 该树为血统树（OurSky 同代生态），直接采用原版 cgroup.c"

      - name: Download toolchain (proton-clang 20210522)
        run: |
          mkdir -p "$HOME/tc"
          cd "$HOME/tc"
          wget -qO tc.zip https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip
          unzip -q tc.zip
          mv proton-clang-20210522 proton-clang
          export PATH="$HOME/tc/proton-clang/bin:$PATH"
          clang --version | head -2
          ld.lld --version | head -1

      - name: Patch vendor hooks build (HuTao77 tree omits vendor_hooks.o)
        run: |
          cd kernel
          echo "=== vendor_hooks.c 存在性 ==="
          ls -la drivers/android/vendor_hooks.c 2>/dev/null || echo "(no vendor_hooks.c)"
          if [ -f drivers/android/vendor_hooks.c ] && ! grep -q "vendor_hooks" drivers/android/Makefile; then
            echo "obj-y += vendor_hooks.o" >> drivers/android/Makefile
            echo ">> patched: obj-y += vendor_hooks.o appended to drivers/android/Makefile"
          fi
          tail -5 drivers/android/Makefile

      - name: Integrate SukiSU (branch = ${{ inputs.ksu_branch }})
        run: |
          cd kernel
          BR="${{ inputs.ksu_branch }}"
          [ -z "$BR" ] && BR="susfs_new"
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "$BR"
          echo "=== drivers/kernelsu 内容 ==="
          ls drivers/kernelsu/ | head -30
          echo "=== kernelsu Kconfig 全部 config 项 ==="
          grep -E "^config " drivers/kernelsu/Kconfig | awk '{print $2}' || true
          echo "=== KPM/SUSFS/MANUAL_HOOK 存在性检查 ==="
          for opt in KPM KSU_MANUAL_HOOK KSU_SUSFS; do
            grep -qE "^config $opt" drivers/kernelsu/Kconfig && echo "Kconfig 有 $opt" || echo "Kconfig 无 $opt"
          done
          echo "=== Makefile 健康检查（防 CFLAGS 污染）==="
          if grep -qE "^(CFLAGS|AFLAGS)[[:space:]]*[:+]?=" drivers/kernelsu/Makefile; then
            echo "!! 检测到 CFLAGS 用法，自动替换为 ccflags-y"
            sed -i 's/^CFLAGS[[:space:]]*:=/ccflags-y :=/; s/^CFLAGS[[:space:]]*+=/ccflags-y +=/; s/^AFLAGS[[:space:]]*:=/asflags-y :=/; s/^AFLAGS[[:space:]]*+=/asflags-y +=/' drivers/kernelsu/Makefile
          else
            echo "Makefile 干净"
          fi
          echo "=== KPM 源文件自检 ==="
          find drivers/kernelsu -iname "*kpm*" | head -10

      - name: Pre-build compat shims (4.19 LTS mode)
        run: |
          cd kernel
          # MODULE_IMPORT_NS (added in Linux 5.13) missing on 4.19 -> empty shim
          if ! grep -q "define MODULE_IMPORT_NS" include/linux/module.h; then
            printf '\n/* build shim (4.19 LTS): MODULE_IMPORT_NS added in 5.13 */\n#ifndef MODULE_IMPORT_NS\n#define MODULE_IMPORT_NS(ns)\n#endif\n' >> include/linux/module.h
            echo ">> shim added: MODULE_IMPORT_NS"
          fi
          # linux/pgtable.h (added 5.8) -> forward to asm/pgtable.h
          if [ ! -f include/linux/pgtable.h ]; then
            printf '#ifndef _LINUX_PGTABLE_SHIM_H\n#define _LINUX_PGTABLE_SHIM_H\n#include <asm/pgtable.h>\n#endif\n' > include/linux/pgtable.h
            echo ">> shim added: linux/pgtable.h"
          fi
          # linux/minmax.h (added 5.10) -> forward to linux/kernel.h
          if [ ! -f include/linux/minmax.h ]; then
            printf '#ifndef _LINUX_MINMAX_SHIM_H\n#define _LINUX_MINMAX_SHIM_H\n#include <linux/kernel.h>\n#endif\n' > include/linux/minmax.h
            echo ">> shim added: linux/minmax.h"
          fi
          # uapi/linux/mount.h (split out of uapi/linux/fs.h in 5.2) -> forward to uapi/linux/fs.h
          # 依据: su_mount_ns.c:16 唯一引用点, 用到 MS_PRIVATE|MS_REC (4.19 定义于 uapi/linux/fs.h L123/129, 已实锤)
          if [ ! -f include/uapi/linux/mount.h ]; then
            printf '#ifndef _UAPI_LINUX_MOUNT_419_SHIM_H\n#define _UAPI_LINUX_MOUNT_419_SHIM_H\n#include <uapi/linux/fs.h>\n#endif\n' > include/uapi/linux/mount.h
            echo ">> shim added: uapi/linux/mount.h"
          fi
          # selinux_cred helper (mainline 5.5+; native 4.19 objsec.h lacks it) -> cred->security
          # 依据: SukiSU selinux.c:35/164/166 调用 selinux_cred(cred); torvalds v4.19 objsec.h 对照实锤无此 helper;
          #       current_security() 是 cred.h L377 宏, 已确认无问题
          if [ -f security/selinux/include/objsec.h ] && ! grep -q "selinux_cred" security/selinux/include/objsec.h; then
            sed -i 's|#endif /\* _SELINUX_OBJSEC_H_ \*/|static inline struct task_security_struct *selinux_cred(const struct cred *cred)\n{ return cred->security; }\n#endif /* _SELINUX_OBJSEC_H_ */|' security/selinux/include/objsec.h
            echo ">> shim added: selinux_cred -> objsec.h"
          fi
          # strscpy_pad (added 5.1) -> exact 5.1 impl built on strscpy
          # 依据: policy/allowlist.c:495 唯一使用点; typezhi string.h 只有 strscpy (L32), 无 strscpy_pad
          if ! grep -q "strscpy_pad" include/linux/string.h; then
            printf '\n/* build shim (4.19): strscpy_pad added in 5.1 */\n#ifndef __KSU_419_STRSCPY_PAD\n#define __KSU_419_STRSCPY_PAD\nstatic inline ssize_t strscpy_pad(char *dest, const char *src, size_t count)\n{\n\tssize_t written;\n\twritten = strscpy(dest, src, count);\n\tif (written < 0 || written == count - 1)\n\t\treturn written;\n\tmemset(dest + written + 1, 0, count - written - 1);\n\treturn written;\n}\n#endif\n' >> include/linux/string.h
            echo ">> shim added: strscpy_pad -> linux/string.h"
          fi
          # !! DO NOT add a global 'fallthrough' macro !!
          # net/sctp/sm_make_chunk.c uses "goto fallthrough;" + "fallthrough:" as a goto LABEL (AOSP legacy naming;
          # upstream renamed it when fallthrough became a pseudo-keyword in 5.4). A global #define breaks SCTP (hit in Run#20).
          # The single C-idiom use (policy/allowlist.c:499) is instead fixed locally via the al419 patch below.
          # 5.8+ nofault family shims (4.19 LTS) —— 仅注入 linux/uaccess.h
          #   strncpy_from_user_nofault -> pagefault_disable + strncpy_from_user
          #   copy_{from,to}_kernel_nofault -> probe_kernel_{read,write}
          #   copy_{from,to}_user_nofault -> access_ok + __copy_*_user_inatomic
          # 依赖符号(probe_kernel_*, access_ok, __copy_*_inatomic, pagefault_*, VERIFY_*)均在注入点之前可见
          NOFAULT_BODY='\n/* build shim (4.19 LTS): 5.8 nofault family -> 4.19 equivalents */\n#ifndef __KSU_4_19_NOFAULT_SHIM\n#define __KSU_4_19_NOFAULT_SHIM\nstatic inline long strncpy_from_user_nofault(char *dst, const void __user *unsafe_addr, long count)\n{\n\tlong ret;\n\tif (unlikely(count <= 0))\n\t\treturn 0;\n\tpagefault_disable();\n\tret = strncpy_from_user(dst, unsafe_addr, count);\n\tpagefault_enable();\n\treturn ret;\n}\nstatic inline long copy_from_kernel_nofault(void *dst, const void *src, size_t size)\n{\n\treturn probe_kernel_read(dst, src, size);\n}\nstatic inline long copy_to_kernel_nofault(void *dst, const void *src, size_t size)\n{\n\treturn probe_kernel_write(dst, src, size);\n}\nstatic inline long copy_from_user_nofault(void *dst, const void __user *src, size_t size)\n{\n\tlong ret;\n\tif (!access_ok(VERIFY_READ, src, size))\n\t\treturn -EFAULT;\n\tpagefault_disable();\n\tret = __copy_from_user_inatomic(dst, src, size);\n\tpagefault_enable();\n\treturn ret ? -EFAULT : 0;\n}\nstatic inline long copy_to_user_nofault(void __user *dst, const void *src, size_t size)\n{\n\tlong ret;\n\tif (!access_ok(VERIFY_WRITE, dst, size))\n\t\treturn -EFAULT;\n\tpagefault_disable();\n\tret = __copy_to_user_inatomic(dst, src, size);\n\tpagefault_enable();\n\treturn ret ? -EFAULT : 0;\n}\n#endif\n'
          if ! grep -q "__KSU_4_19_NOFAULT_SHIM" include/linux/uaccess.h; then
            printf "$NOFAULT_BODY" >> include/linux/uaccess.h
            echo ">> shim added: nofault family -> linux/uaccess.h"
          fi
          # belt-and-suspenders: 直接替换 kernelsu 内调用点(与 shim 等价)
          echo "=== nofault usage scan ==="
          grep -rn "nofault" drivers/kernelsu/ || echo "(none)"
          echo "=== find diag (symlink check) ==="
          ls -ld drivers/kernelsu || true
          echo "=== replace via grep -rl ==="
          grep -rlE "strncpy_from_user_nofault|copy_to_kernel_nofault|copy_from_kernel_nofault|copy_from_user_nofault|copy_to_user_nofault" drivers/kernelsu/ 2>/dev/null | while IFS= read -r f; do
            sed -i 's/strncpy_from_user_nofault(/strncpy_from_user(/; s/copy_to_kernel_nofault(/probe_kernel_write(/; s/copy_from_kernel_nofault(/probe_kernel_read(/; s/from_user_nofault(/from_user(/; s/to_user_nofault(/to_user(/' "$f"
            echo "  replaced: $f"
          done
          # 5.15+ TWA_RESUME -> 4.19 bool notify (true = run before returning to user)
          grep -rl "TWA_RESUME" drivers/kernelsu/ 2>/dev/null | while IFS= read -r f; do
            sed -i 's/\bTWA_RESUME\b/true/g' "$f"
            echo "  TWA_RESUME->true: $f"
          done
          # --- explicit include fixes for files that rely on transitive includes ---
          # supercall/dispatch.c: tasklist_lock+init_task = linux/sched/task.h,
          #                       task_pgrp/task_session   = linux/sched/signal.h
          if ! grep -q "linux/sched/signal.h" drivers/kernelsu/supercall/dispatch.c; then
            sed -i 's|#include <linux/thread_info.h>|#include <linux/thread_info.h>\n#include <linux/sched/task.h>\n#include <linux/sched/signal.h>|' drivers/kernelsu/supercall/dispatch.c
            echo ">> include added: sched/{task,signal}.h -> supercall/dispatch.c"
          fi
          # feature/adb_root.c: ALIGN_DOWN lives in linux/kernel.h (4.19)
          if ! grep -q "linux/kernel.h" drivers/kernelsu/feature/adb_root.c; then
            sed -i 's|#include <linux/static_key.h>|#include <linux/kernel.h>\n#include <linux/static_key.h>|' drivers/kernelsu/feature/adb_root.c
            echo ">> include added: linux/kernel.h -> feature/adb_root.c"
          fi
          echo "=== include fix verify (expect 1 / 1) ==="
          grep -c "linux/sched/signal.h" drivers/kernelsu/supercall/dispatch.c || true
          grep -c "linux/kernel.h" drivers/kernelsu/feature/adb_root.c || true
          # --- DRM/MSM subtree fix (pre-applied; only matters once DRM_MSM is enabled) ---
          # msm_drv.c compare_name_mdp(): 2-arg strnstr(); 4.19 signature is strnstr(s1,s2,len)
          # intended semantics = "does dev_name contain mdp" -> strstr()
          if grep -q 'strnstr(dev_name(dev), "mdp")' drivers/gpu/drm/msm/msm_drv.c 2>/dev/null; then
            sed -i 's/strnstr(dev_name(dev), "mdp")/strstr(dev_name(dev), "mdp")/' drivers/gpu/drm/msm/msm_drv.c
            echo ">> drm/msm: strnstr -> strstr (2-arg fix pre-applied)"
          fi
          echo "=== after replace ==="
          grep -rn "nofault" drivers/kernelsu/ || echo "(no more references)"
          echo "=== proactive scan: known 5.8+ APIs ==="
          for api in copy_struct_from_user vma_lookup mmap_read_lock mmap_write_lock pin_user_pages ktime_get_boottime_ts64; do
            echo "--- $api ---"
            grep -rn "$api" drivers/kernelsu/ | head -3 || true
          done
          echo "=== shims in place ==="
          ls -la include/linux/pgtable.h include/linux/minmax.h 2>/dev/null || true
          grep -c "build shim" include/linux/module.h

      - name: Patch file_wrapper.c for 4.19 (iopoll/remap/anon-sec/selinux compat)
        run: |
          cd kernel
          echo 'LS0tIGEvZHJpdmVycy9rZXJuZWxzdS9pbmZyYS9maWxlX3dyYXBwZXIuYworKysgYi9kcml2ZXJz
          L2tlcm5lbHN1L2luZnJhL2ZpbGVfd3JhcHBlci5jCkBAIC0yMCw2ICsyMCwxMiBAQAogCiAjaW5j
