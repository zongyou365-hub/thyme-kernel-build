name: Build thyme 4.19.325 (SukiSU+KPM)

on:
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: "SukiSU branch (builtin = KPM+SUSFS)"
        default: "builtin"
        type: string
      target:
        description: "make target"
        default: "Image"
        type: string
      localversion:
        description: "CONFIG_LOCALVERSION (must match installed module vermagic)"
        default: "-HyperOS3-A16-Sky-Developers"
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --force || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache clang flex git \
            libc6-dev libelf-dev libncurses5-dev libncurses-dev \
            libssl-dev lld llvm zip curl wget unzip \
            python3 python-is-python3 cpio \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          clang --version | head -2 || true

      - name: Clone kernel source (HuTao77 thyme 16.0 / 4.19.325)
        run: |
          git clone --depth=1 -b 16.0 \
            https://github.com/HuTao77-Studio/android_kernel_xiaomi_thyme.git kernel
          cd kernel
          echo "=== strip localversion-cip / -st (scripts/setlocalversion appends them) ==="
          ls -la localversion-* 2>/dev/null || true
          rm -f localversion-cip localversion-st
          echo "=== HEAD ==="
          git log -1 --format="%H %cd %s"
          echo "=== Version ==="
          head -6 Makefile
          echo "=== defconfig ==="
          ls -la arch/arm64/configs/thyme_defconfig
          echo "=== base key configs ==="
          grep -E "CONFIG_(LOCALVERSION|MODVERSIONS|MODULE_SIG|CGROUP_BPF|IKCONFIG)" arch/arm64/configs/thyme_defconfig
          echo "=== cgroup.c structure ==="
          grep -n "purge_effective_progs\|update_effective_progs" kernel/bpf/cgroup.c | head -8

      - name: Download toolchain (proton-clang 20210522 = clang 13.0.0)
        run: |
          mkdir -p "$HOME/tc" && cd "$HOME/tc"
          wget -qO tc.zip https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip
          unzip -q tc.zip
          mv proton-clang-20210522 proton-clang
          export PATH="$HOME/tc/proton-clang/bin:$PATH"
          clang --version | head -2
          ld.lld --version | head -1

      - name: Patch vendor hooks build
        run: |
          cd kernel
          ls -la drivers/android/vendor_hooks.c 2>/dev/null || echo "(no vendor_hooks.c)"
          if [ -f drivers/android/vendor_hooks.c ] && ! grep -q "vendor_hooks" drivers/android/Makefile; then
            echo "obj-y += vendor_hooks.o" >> drivers/android/Makefile
            echo ">> patched vendor_hooks.o"
          fi
          tail -3 drivers/android/Makefile

      - name: Patch DRM msm_drv strnstr (2-arg call, 4.19 needs 3)
        run: |
          cd kernel
          echo "=== before ==="
          sed -n '1230,1240p' drivers/gpu/drm/msm/msm_drv.c
          sed -i 's/strnstr(dev_name(dev), "mdp")/strstr(dev_name(dev), "mdp")/' drivers/gpu/drm/msm/msm_drv.c
          echo "=== after ==="
          grep -n "strstr(dev_name" drivers/gpu/drm/msm/msm_drv.c
          echo "=== scan other suspicious 2-arg strnstr ==="
          grep -rn "strnstr(" drivers/gpu techpack 2>/dev/null | grep -vE "strnstr\([^,]+, *[^,]+, *[^)]+\)" | head -10 || true

      - name: Integrate SukiSU
        run: |
          cd kernel
          BR="${{ inputs.ksu_branch }}"
          [ -z "$BR" ] && BR="builtin"
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "$BR"
          echo "=== drivers/kernelsu ==="
          ls drivers/kernelsu/ | head -30
          echo "=== Kconfig items ==="
          grep -E "^config " drivers/kernelsu/Kconfig | awk '{print $2}' | tr '\n' ' '; echo
          echo "=== KPM source files ==="
          find drivers/kernelsu -iname "*kpm*" | head -10
          echo "=== Makefile CFLAGS health check ==="
          if grep -qE "^(CFLAGS|AFLAGS)[[:space:]]*[:+]?=" drivers/kernelsu/Makefile; then
            sed -i 's/^CFLAGS[[:space:]]*:=/ccflags-y :=/; s/^CFLAGS[[:space:]]*+=/ccflags-y +=/; s/^AFLAGS[[:space:]]*:=/asflags-y :=/; s/^AFLAGS[[:space:]]*+=/asflags-y +=/' drivers/kernelsu/Makefile
            echo "patched CFLAGS -> ccflags-y"
          else
            echo "Makefile clean"
          fi
          echo "=== Kbuild wiring ==="
          grep -n "kernelsu" drivers/Kconfig drivers/Makefile 2>/dev/null | head -6

      - name: Configure
        id: cfg
        run: |
          cd kernel
          make O=out ARCH=arm64 thyme_defconfig
          SC="./scripts/config --file out/.config"
          # --- align with installed vendor modules ---
          $SC --set-str LOCALVERSION "${{ inputs.localversion }}"
          $SC -d LOCALVERSION_AUTO
          $SC -d MODULE_SIG_FORCE
          $SC -e MODULE_SIG
          $SC -e MODVERSIONS
          # --- boot / runtime essentials ---
          # NOTE: DRM_MSM must stay OFF. This tree drives display via techpack/display/msm;
          # enabling drivers/gpu/drm/msm causes duplicate symbols (msm_dss_*, msm_framebuffer_*, ...).
          for opt in DEVTMPFS DEVTMPFS_MOUNT REGULATOR_QCOM_SPMI QCOM_TSENS \
                     ANDROID_VENDOR_HOOKS TRACEPOINTS KALLSYMS KALLSYMS_ALL \
                     IKCONFIG IKCONFIG_PROC PSTORE PSTORE_CONSOLE PSTORE_PMSG PSTORE_RAM; do
            $SC -e "$opt" 2>/dev/null || true
          done
          # --- KernelSU ---
          $SC -d KSU_MODULE 2>/dev/null || true
          $SC -e KSU
          grep -qE "^config KSU_MANUAL_HOOK" drivers/kernelsu/Kconfig && $SC -e KSU_MANUAL_HOOK || echo "(no KSU_MANUAL_HOOK)"
          # --- SUSFS ---
          for opt in KSU_SUSFS SUSFS; do
            grep -qE "^config $opt" drivers/kernelsu/Kconfig && $SC -e "$opt" || true
          done
          for opt in $(grep -oE "^config KSU_SUSFS_[A-Z_0-9]+" drivers/kernelsu/Kconfig | awk '{print $2}'); do
            $SC -e "$opt" 2>/dev/null || true
          done
          make O=out ARCH=arm64 olddefconfig
          echo "=== config verify ==="
          grep -E "CONFIG_(LOCALVERSION|MODULE_SIG_FORCE|MODVERSIONS|DEVTMPFS|DRM_MSM|KSU|KALLSYMS_ALL|IKCONFIG)[= ]" out/.config | grep -v "^#" || true
          echo "--- KSU/SUSFS ---"
          grep -E "CONFIG_(KSU|SUSFS)[A-Z_]*=" out/.config | head -20 || true
          echo "--- MISS check ---"
          for opt in DEVTMPFS KALLSYMS_ALL KSU; do
            grep -q "^CONFIG_$opt=y" out/.config && echo "  OK   $opt" || echo "  MISS $opt"
          done
          echo "--- display stack (techpack, DRM_MSM must be off) ---"
          grep -E "CONFIG_(DRM_MSM|TECHPACK|DRM_MSM_SDE)[= ]" out/.config | grep -v "^#" || echo "  DRM_MSM not set (expected)"

      - name: Build Image
        id: build
        run: |
          cd kernel
          export PATH="$HOME/tc/proton-clang/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KBUILD_BUILD_VERSION=1
          export KBUILD_BUILD_USER=builder
          export KBUILD_BUILD_HOST=builder
          TGT="${{ inputs.target }}"
          [ -z "$TGT" ] && TGT="Image"
          set -o pipefail
          make O=out ARCH=arm64 CC=clang LD=ld.lld \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j"$(nproc)" "$TGT" > "build_${TGT}.log" 2>&1 || {
              echo "=== BUILD FAILED ==="
              grep -nE "error:|fatal:|undefined reference|Error [0-9]+|No rule to make target" "build_${TGT}.log" | tail -60
              echo "=== last tasks ==="
              grep -E "^  (CC|LD|AR|GEN|OBJCOPY) " "build_${TGT}.log" | tail -15
              exit 1
            }
          ls -la out/arch/arm64/boot/
          echo "=== version string ==="
          strings out/arch/arm64/boot/$TGT | grep -m2 "Linux version"
          echo "=== vermagic ==="
          strings out/arch/arm64/boot/$TGT | grep -m1 "SMP preempt"
          echo "=== symbol self-check ==="
          for kw in sukisu_kpm_control susfs KernelSU; do
            echo "  $kw = $(strings out/arch/arm64/boot/$TGT | grep -c "$kw")"
          done

      - name: Upload kernel + log
        uses: actions/upload-artifact@v4
        with:
          name: thyme-325-Image
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/build_Image.log
          if-no-files-found: error

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: kernel/build_*.log
          if-no-files-found: ignore
