name: Build thyme kernel (SukiSU + KPM + SUSFS)

on:
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: "SukiSU setup.sh 分支 (susfs_new=官方SUSFS集成 / main / dev)"
        default: "susfs_new"
        type: string
      enable_kpm:
        description: "启用 KPM (CONFIG_KPM=y)"
        default: "true"
        type: string
      build_target:
        description: "编译目标 (Image.gz-dtb / Image.gz / auto)"
        default: "auto"
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --force
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache clang flex git \
            libc6-dev libelf-dev libncurses5-dev libncurses-dev \
            libssl-dev lld llvm zip curl wget unzip \
            python3 python-is-python3 cpio \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          echo "=== clang version ==="
          clang --version | head -2 || true

      - name: Clone kernel source (typezhi/Rinko thyme bloodline tree, 4.19.157)
        run: |
          git clone -b thirteen --filter=blob:none \
            https://github.com/typezhi/Rinko_android_kernel_xiaomi_thyme.git kernel
          cd kernel
          echo "=== HEAD commit ==="
          git log -1 --format="%H %cd %s"
          echo "=== Makefile VERSION ==="
          head -6 Makefile
          echo "=== thyme defconfig 候选 ==="
          ls arch/arm64/configs/ | grep -i thyme || echo "(no thyme-named defconfig)"
          echo "=== cgroup.c 修复前状态 ==="
          grep -c purge_effective_progs kernel/bpf/cgroup.c || true

      - name: Backport note (SKIPPED - arch mismatch)
        run: |
          echo "cgroup-bpf UAF fix chain NOT applied:"
          echo "- 85afe915/50ff8807 target the 2020 'decouple' cgroup_bpf arch (missing in 4.19.157)"
          echo "- 9369ced0/abf096ae target bpf_cgroup_link (missing in 4.19.157)"
          echo "- 157 uses synchronous hierarchical release: the out-of-order UAF path does not exist"
          echo "- 该树为血统树（OurSky 同代生态），直接采用原版 cgroup.c"

      - name: Download toolchain (proton-clang 20210522)
        run: |
          mkdir -p "$HOME/tc"
          cd "$HOME/tc"
          wget -qO tc.zip https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip
          unzip -q tc.zip
          mv proton-clang-20210522 proton-clang
          export PATH="$HOME/tc/proton-clang/bin:$PATH"
          clang --version | head -2
          ld.lld --version | head -1

      - name: Patch vendor hooks build (HuTao77 tree omits vendor_hooks.o)
        run: |
          cd kernel
          echo "=== vendor_hooks.c 存在性 ==="
          ls -la drivers/android/vendor_hooks.c 2>/dev/null || echo "(no vendor_hooks.c)"
          if [ -f drivers/android/vendor_hooks.c ] && ! grep -q "vendor_hooks" drivers/android/Makefile; then
            echo "obj-y += vendor_hooks.o" >> drivers/android/Makefile
            echo ">> patched: obj-y += vendor_hooks.o appended to drivers/android/Makefile"
          fi
          tail -5 drivers/android/Makefile

      - name: Integrate SukiSU (branch = ${{ inputs.ksu_branch }})
        run: |
          cd kernel
          BR="${{ inputs.ksu_branch }}"
          [ -z "$BR" ] && BR="susfs_new"
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "$BR"
          echo "=== drivers/kernelsu 内容 ==="
          ls drivers/kernelsu/ | head -30
          echo "=== kernelsu Kconfig 全部 config 项 ==="
          grep -E "^config " drivers/kernelsu/Kconfig | awk '{print $2}' || true
          echo "=== KPM/SUSFS/MANUAL_HOOK 存在性检查 ==="
          for opt in KPM KSU_MANUAL_HOOK KSU_SUSFS; do
            grep -qE "^config $opt" drivers/kernelsu/Kconfig && echo "Kconfig 有 $opt" || echo "Kconfig 无 $opt"
          done
          echo "=== Makefile 健康检查（防 CFLAGS 污染）==="
          if grep -qE "^(CFLAGS|AFLAGS)[[:space:]]*[:+]?=" drivers/kernelsu/Makefile; then
            echo "!! 检测到 CFLAGS 用法，自动替换为 ccflags-y"
            sed -i 's/^CFLAGS[[:space:]]*:=/ccflags-y :=/; s/^CFLAGS[[:space:]]*+=/ccflags-y +=/; s/^AFLAGS[[:space:]]*:=/asflags-y :=/; s/^AFLAGS[[:space:]]*+=/asflags-y +=/' drivers/kernelsu/Makefile
          else
            echo "Makefile 干净"
          fi
          echo "=== KPM 源文件自检 ==="
          find drivers/kernelsu -iname "*kpm*" | head -10

      - name: Pre-build compat shims (4.19 LTS mode)
        run: |
          cd kernel
          # MODULE_IMPORT_NS (added in Linux 5.13) missing on 4.19 -> empty shim
          if ! grep -q "define MODULE_IMPORT_NS" include/linux/module.h; then
            printf '\n/* build shim (4.19 LTS): MODULE_IMPORT_NS added in 5.13 */\n#ifndef MODULE_IMPORT_NS\n#define MODULE_IMPORT_NS(ns)\n#endif\n' >> include/linux/module.h
            echo ">> shim added: MODULE_IMPORT_NS"
          fi
          # linux/pgtable.h (added 5.8) -> forward to asm/pgtable.h
          if [ ! -f include/linux/pgtable.h ]; then
            printf '#ifndef _LINUX_PGTABLE_SHIM_H\n#define _LINUX_PGTABLE_SHIM_H\n#include <asm/pgtable.h>\n#endif\n' > include/linux/pgtable.h
            echo ">> shim added: linux/pgtable.h"
          fi
          # linux/minmax.h (added 5.10) -> forward to linux/kernel.h
          if [ ! -f include/linux/minmax.h ]; then
            printf '#ifndef _LINUX_MINMAX_SHIM_H\n#define _LINUX_MINMAX_SHIM_H\n#include <linux/kernel.h>\n#endif\n' > include/linux/minmax.h
            echo ">> shim added: linux/minmax.h"
          fi
          # 5.8+ nofault family shims (4.19 LTS):
          #   strncpy_from_user_nofault -> strncpy_from_user
          #   copy_{from,to}_kernel_nofault -> probe_kernel_{read,write} (5.8 改名)
          # 自包含 extern 声明，避免 include 顺序死角
          NOFAULT_BODY='\n/* build shim (4.19 LTS): 5.8+ nofault family */\n#ifndef __KSU_4_19_NOFAULT_SHIM\n#define __KSU_4_19_NOFAULT_SHIM\nextern long probe_kernel_read(void *dst, const void *src, size_t size);\nextern long probe_kernel_write(void *dst, const void *src, size_t size);\nextern long strncpy_from_user(char *dest, const char __user *src, long count);\nstatic inline long strncpy_from_user_nofault(char *dst, const void __user *src, long count)\n{\n\treturn strncpy_from_user(dst, src, count);\n}\nstatic inline long copy_from_kernel_nofault(void *dst, const void *src, size_t size)\n{\n\treturn probe_kernel_read(dst, src, size);\n}\nstatic inline long copy_to_kernel_nofault(void *dst, const void *src, size_t size)\n{\n\treturn probe_kernel_write(dst, src, size);\n}\n#endif\n'
          if ! grep -q "__KSU_4_19_NOFAULT_SHIM" include/linux/uaccess.h; then
            printf "$NOFAULT_BODY" >> include/linux/uaccess.h
            echo ">> shim added: nofault family -> linux/uaccess.h"
          fi
          if ! grep -q "__KSU_4_19_NOFAULT_SHIM" arch/arm64/include/asm/uaccess.h; then
            printf "$NOFAULT_BODY" >> arch/arm64/include/asm/uaccess.h
            echo ">> shim added: nofault family -> asm/uaccess.h"
          fi
          # belt-and-suspenders: 直接替换 kernelsu 内调用点(与 shim 等价)
          echo "=== nofault usage scan ==="
          grep -rn "nofault" drivers/kernelsu/ || echo "(none)"
          echo "=== find diag (symlink check) ==="
          ls -ld drivers/kernelsu || true
          echo "=== replace via grep -rl ==="
          grep -rlE "strncpy_from_user_nofault|copy_to_kernel_nofault|copy_from_kernel_nofault" drivers/kernelsu/ 2>/dev/null | while IFS= read -r f; do
            sed -i 's/strncpy_from_user_nofault(/strncpy_from_user(/; s/copy_to_kernel_nofault(/probe_kernel_write(/; s/copy_from_kernel_nofault(/probe_kernel_read(/' "$f"
            echo "  replaced: $f"
          done
          echo "=== after replace ==="
          grep -rn "nofault" drivers/kernelsu/ || echo "(no more references)"
          echo "=== proactive scan: known 5.8+ APIs ==="
          for api in copy_struct_from_user vma_lookup mmap_read_lock mmap_write_lock pin_user_pages ktime_get_boottime_ts64; do
            echo "--- $api ---"
            grep -rn "$api" drivers/kernelsu/ | head -3 || true
          done
          echo "=== shims in place ==="
          ls -la include/linux/pgtable.h include/linux/minmax.h 2>/dev/null || true
          grep -c "build shim" include/linux/module.h

      - name: Detect defconfig and base config
        id: defc
        run: |
          cd kernel
          DEF=""
          for cand in thyme_defconfig thyme-user_defconfig thyme-perf_defconfig; do
            if [ -f "arch/arm64/configs/$cand" ]; then DEF="$cand"; break; fi
          done
          if [ -z "$DEF" ]; then
            DEF=$(ls arch/arm64/configs/ | grep -i thyme | head -1)
          fi
          if [ -z "$DEF" ]; then
            echo "!! 找不到 thyme defconfig，列出 sm8250 相关:" 
            ls arch/arm64/configs/ | grep -iE "sm8250|vendor" || true
            exit 1
          fi
          echo "defconfig=$DEF" >> "$GITHUB_OUTPUT"
          echo "使用 defconfig: $DEF"
          make O=out ARCH=arm64 "$DEF"
          echo "=== 基线配置关键项 ==="
          grep -E "CONFIG_(KALLSYMS|LOCALVERSION|MODULE)" out/.config | head -10

      - name: Enable KSU / KPM / SUSFS / KALLSYMS
        run: |
          cd kernel
          SC="./scripts/config --file out/.config"
          # 0) Android vendor hooks（drivers/android/vendor_hooks.o 依赖；树引用 android_vh_* 符号）
          $SC -e ANDROID_VENDOR_HOOKS
          $SC -e TRACEPOINTS
          # 0.5) 对齐"可启动基准"（M13/OurSky 共有、defconfig 缺失的 36 项）
          #    关键: XDP_SOCKETS (tethering netbpfload), WIREGUARD, CRYPTO 系列, F2FS 压缩等
          for opt in XDP_SOCKETS WIREGUARD BOARD_XIAOMI CFS_BANDWIDTH FB XLOGCHAR \
                     CRYPTO_842 CRYPTO_LZ4 CRYPTO_LZ4HC CRYPTO_LZO CRYPTO_ZSTD \
                     F2FS_FS_COMPRESSION \
                     PSTORE_COMPRESS PSTORE_DEFLATE_COMPRESS PSTORE_DEFLATE_COMPRESS_DEFAULT \
                     CNSS_QCA6390 \
                     CAN_8DEV_USB CAN_EMS_USB CAN_ESD_USB2 CAN_GS_USB CAN_KVASER_USB \
                     CAN_MCBA_USB CAN_SLCAN CAN_UCAN CAN_VCAN CAN_VXCAN \
                     USB_SERIAL_CH341 USB_SERIAL_OTI6858 USB_SERIAL_PL2303 \
                     USB_SERIAL_QT2 USB_SERIAL_SPCP8X5 USB_SERIAL_TI USB_SERIAL_UPD78F0730; do
            $SC -e "$opt" 2>/dev/null || true
          done
          $SC --set-str PSTORE_COMPRESS_DEFAULT "deflate" 2>/dev/null || true
          # 1) KALLSYMS（KPM 硬性前提）
          $SC -e KALLSYMS -e KALLSYMS_ALL
          # 2) KernelSU 本体
          $SC -d KSU_MODULE 2>/dev/null || true
          $SC -e KSU
          # 3) non-GKI 手动钩子（4.19 必需；若无此项则忽略）
          grep -qE "^config KSU_MANUAL_HOOK" drivers/kernelsu/Kconfig && $SC -e KSU_MANUAL_HOOK || echo "(no KSU_MANUAL_HOOK in Kconfig)"
          # 4) KPM 源码编译禁用（改用管理器 kpimg 二进制修补路线，规避源码兼容性）
          $SC -d KPM 2>/dev/null || true
          echo "KPM source build disabled (manager kpimg binary patch path used instead)"
          # 5) SUSFS（susfs-main 分支才有）
          for opt in KSU_SUSFS SUSFS; do
            grep -qE "^config $opt" drivers/kernelsu/Kconfig && $SC -e "$opt" && echo "enabled $opt" || true
          done
          # SUSFS 子项全开
          for opt in $(grep -oE "^config KSU_SUSFS_[A-Z_0-9]+" drivers/kernelsu/Kconfig | awk '{print $2}'); do
            $SC -e "$opt" && echo "enabled $opt" || true
          done
          # 6) LOCALVERSION 标记
          $SC --set-str LOCALVERSION "-thyme-SukiSU-KPM"
          make O=out ARCH=arm64 olddefconfig
          echo "=== 最终配置核验 ==="
          grep -E "CONFIG_(KSU|KPM|KALLSYMS|SUSFS|KSU_MANUAL_HOOK|LOCALVERSION)[=_]" out/.config | grep -v "^#" || true

      - name: Build kernel
        id: build
        run: |
          cd kernel
          export PATH="$HOME/tc/proton-clang/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang LD=ld.lld
          export AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          export KBUILD_BUILD_VERSION=1
          export KBUILD_BUILD_USER=builder
          export KBUILD_BUILD_HOST=builder
          TARGET="${{ inputs.build_target }}"
          [ -z "$TARGET" ] && TARGET="auto"
          set -o pipefail
          build_one() {
            make O=out ARCH=arm64 CC=clang LD=ld.lld \
              AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
              CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              -j"$(nproc)" "$1" 2>&1 | tail -80
          }
          if [ "$TARGET" = "auto" ] || [ "$TARGET" = "Image.gz-dtb" ]; then
            echo "### 尝试 Image.gz-dtb ###"
            if build_one "Image.gz-dtb"; then
              echo "target=Image.gz-dtb" >> "$GITHUB_OUTPUT"
            else
              echo "### Image.gz-dtb 失败，退回 Image.gz ###"
              build_one "Image.gz" && echo "target=Image.gz" >> "$GITHUB_OUTPUT" || exit 1
            fi
          else
            build_one "$TARGET" && echo "target=$TARGET" >> "$GITHUB_OUTPUT" || exit 1
          fi
          echo "=== 产物 ==="
          ls -la out/arch/arm64/boot/
          echo "=== 内核版本串 ==="
          strings out/arch/arm64/boot/Image* | grep -m1 "Linux version" || true
          echo "=== KPM 符号自检（>0 = KPM 已编入）==="
          for IMG in out/arch/arm64/boot/Image*; do
            if [ -f "$IMG" ]; then
              KC=$(strings "$IMG" | grep -c "sukisu_kpm" || true)
              KP=$(strings "$IMG" | grep -c "KernelPatch" || true)
              echo "$IMG: sukisu_kpm=$KC KernelPatch=$KP"
            fi
          done
          echo "=== SUSFS 符号自检 ==="
          for IMG in out/arch/arm64/boot/Image*; do
            if [ -f "$IMG" ]; then
              SC=$(strings "$IMG" | grep -c "susfs" || true)
              echo "$IMG: susfs=$SC"
            fi
          done

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/.github ak3/README.md ak3/anykernel.sh.bak
          T="${{ steps.build.outputs.target }}"
          if [ "$T" = "Image.gz-dtb" ] && [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb ak3/Image.gz-dtb
            sed -i 's/^BLOCK.*=.*$/BLOCK = auto;/; s|^#.*Image.gz-dtb.*|Image.gz-dtb|' ak3/anykernel.sh || true
          else
            cp kernel/out/arch/arm64/boot/Image.gz ak3/Image.gz
            # dtb 单独打包（若生成）
            if [ -d kernel/out/arch/arm64/boot/dts/qcom ]; then
              find kernel/out/arch/arm64/boot/dts/qcom -name "*.dtb" -exec cp {} ak3/dtb/ \; 2>/dev/null || true
            fi
          fi
          cd ak3
          zip -r9 "../AnyKernel3-thyme-SukiSU-KPM-SUSFS.zip" .
          cd ..
          ls -la AnyKernel3-*.zip

      - name: Also upload raw Image
        run: |
          T="${{ steps.build.outputs.target }}"
          cp "kernel/out/arch/arm64/boot/$T" "./thyme-kernel-${T}-SukiSU-KPM.img" 2>/dev/null || \
            cp kernel/out/arch/arm64/boot/Image "./thyme-kernel-Image-SukiSU-KPM.img"
          ls -la thyme-kernel-*.img || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thyme-kernel-SukiSU-KPM-SUSFS
          path: |
            AnyKernel3-*.zip
            thyme-kernel-*.img
          if-no-files-found: error

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            AnyKernel3-*.zip
            thyme-kernel-*.img
