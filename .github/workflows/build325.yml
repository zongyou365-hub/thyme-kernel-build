      - name: Configure
        id: cfg
        run: |
          cd kernel
          make O=out ARCH=arm64 thyme_defconfig
          echo "=== KSU right after thyme_defconfig? ==="
          grep -n "^CONFIG_KSU" out/.config || echo "(KSU absent in defconfig output -> Kconfig not parsed)"
          # --- merge Xiaomi platform fragments (MANDATORY) ---
          # thyme_defconfig alone lacks CONFIG_MACH_XIAOMI_THYME / QCA_CLD_WLAN / CMDLINE /
          # touch / charger / fingerprint etc. Booting without these hangs before pstore init.
          ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/vendor/xiaomi/sm8250-common.config \
            arch/arm64/configs/vendor/xiaomi/thyme.config
          echo "=== fragment merge check ==="
          grep -E "CONFIG_(MACH_XIAOMI_THYME|QCA_CLD_WLAN|BUILD_ARM64_DT_OVERLAY|CMDLINE|TOUCHSCREEN_ST_FTS_V521)=" out/.config || echo "  !! fragment keys MISSING"
          SC="./scripts/config --file out/.config"
          # --- align with installed vendor modules ---
          $SC --set-str LOCALVERSION "${{ inputs.localversion || '-HyperOS3-A16-Sky-Developers' }}"
          $SC -d LOCALVERSION_AUTO
          $SC -d MODULE_SIG_FORCE
          $SC -e MODULE_SIG
          $SC -e MODVERSIONS
          # --- boot / runtime essentials ---
          # NOTE: DRM_MSM must stay OFF. This tree drives display via techpack/display/msm;
          # enabling drivers/gpu/drm/msm causes duplicate symbols (msm_dss_*, msm_framebuffer_*, ...).
          for opt in DEVTMPFS DEVTMPFS_MOUNT REGULATOR_QCOM_SPMI QCOM_TSENS \
                     ANDROID_VENDOR_HOOKS TRACEPOINTS KALLSYMS KALLSYMS_ALL \
                     IKCONFIG IKCONFIG_PROC PSTORE PSTORE_CONSOLE PSTORE_PMSG PSTORE_RAM; do
            $SC -e "$opt" 2>/dev/null || true
          done
          # --- KernelSU ---
          # ROOT CAUSE: kernelsu/Kconfig has `config KSU  depends on KPROBES && EXT4_FS`.
          # thyme_defconfig uses F2FS and leaves both off -> CONFIG_KSU is invisible to Kconfig,
          # so olddefconfig silently drops it even after scripts/config -e KSU.
          if [ "${{ inputs.with_ksu }}" != "false" ]; then
            $SC -e KPROBES
            $SC -e EXT4_FS
            $SC -d KSU_MODULE 2>/dev/null || true
            $SC -e KSU
            echo "=== after scripts/config -e KSU ==="
            grep -n "^CONFIG_KSU" out/.config || echo "(scripts/config -e KSU had no effect)"
            grep -qE "^config KSU_MANUAL_HOOK" drivers/kernelsu/Kconfig && $SC -e KSU_MANUAL_HOOK || echo "(no KSU_MANUAL_HOOK)"
            # --- KPM (builtin branch, default n) ---
            grep -qE "^config KPM" drivers/kernelsu/Kconfig && $SC -e KPM && echo "KPM enabled" || echo "(no KPM in Kconfig)"
            # --- SUSFS: OFF (headers not bundled, needs susfs4ksu + fs patches) ---
            $SC -d KSU_SUSFS 2>/dev/null || true
            echo "SUSFS disabled (headers not bundled in builtin branch)"
          else
            echo "=== with_ksu=false -> vanilla boot test, KSU skipped ==="
          fi
          make O=out ARCH=arm64 olddefconfig
          echo "=== config verify ==="
          grep -E "CONFIG_(LOCALVERSION|MODULE_SIG_FORCE|MODVERSIONS|DEVTMPFS|DRM_MSM|KSU|KALLSYMS_ALL|IKCONFIG)[= ]" out/.config | grep -v "^#" || true
          echo "--- KSU/SUSFS ---"
          grep -E "CONFIG_(KSU|SUSFS)[A-Z_]*=" out/.config | head -20 || true
          echo "--- MISS check ---"
          for opt in DEVTMPFS KALLSYMS_ALL KSU KPM; do
            grep -q "^CONFIG_$opt=y" out/.config && echo "  OK   $opt" || echo "  MISS $opt"
          done
          echo "--- hard requirement (fail fast) ---"
          if [ "${{ inputs.with_ksu }}" != "false" ]; then
            for opt in KSU KPM; do
              grep -q "^CONFIG_$opt=y" out/.config || { echo "!! FATAL: CONFIG_$opt=y missing, aborting before 20min build"; exit 1; }
            done
          else
            echo "  skipped (vanilla build)"
          fi
          echo "--- display stack (techpack, DRM_MSM must be off) ---"
          grep -E "CONFIG_(DRM_MSM|TECHPACK|DRM_MSM_SDE)[= ]" out/.config | grep -v "^#" || echo "  DRM_MSM not set (expected)"

      - name: Build Image
        id: build
        run: |
          cd kernel
          export PATH="$HOME/tc/clang/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KBUILD_BUILD_VERSION=1
          export KBUILD_BUILD_USER=builder
          export KBUILD_BUILD_HOST=builder
          clang --version | head -2
          TGT="${{ inputs.target || 'Image' }}"
          [ -z "$TGT" ] && TGT="Image"
          set -o pipefail
          make O=out ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j"$(nproc)" -k "$TGT" > "build_${TGT}.log" 2>&1 || {
              echo "=== BUILD FAILED ==="
              echo "=== ALL UNIQUE ERRORS (deduped) ==="
              grep -hE "error:|fatal error:|undefined reference" "build_${TGT}.log" | sed 's/^\.\.\///' | sort -u | head -120
              echo "=== failing objects ==="
              grep -oE "drivers/kernelsu/[a-z_/]+\.c" "build_${TGT}.log" | sort -u | head -40
              echo "=== last tasks ==="
              grep -E "^  (CC|LD|AR|GEN|OBJCOPY) " "build_${TGT}.log" | tail -15
              exit 1
            }
          ls -la out/arch/arm64/boot/
          echo "=== version string ==="
          strings out/arch/arm64/boot/$TGT | grep -m2 "Linux version"
          echo "=== vermagic ==="
          strings out/arch/arm64/boot/$TGT | grep -m1 "SMP preempt"
          echo "=== symbol self-check ==="
          for kw in sukisu_kpm_control kpm KernelSU; do
            echo "  $kw = $(strings out/arch/arm64/boot/$TGT | grep -c "$kw")"
          done

      - name: Upload kernel + log
        uses: actions/upload-artifact@v7
        with:
          name: thyme-325-Image
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/build_Image.log
          if-no-files-found: error

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-failure
          path: kernel/build_*.log
          if-no-files-found: ignore

      - name: Publish kernel to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kernel build ${{ github.run_number }}
          files: |
            kernel/out/arch/arm64/boot/Image
            kernel/build_Image.log
          token: ${{ secrets.GITHUB_TOKEN }}
