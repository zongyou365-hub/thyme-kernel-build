name: Build thyme 4.19.325 (SukiSU+KPM)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build325.yml'
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: "SukiSU branch (susfs_new = best 4.19 compat + KPM)"
        default: "susfs_new"
        type: string
      target:
        description: "make target"
        default: "Image"
        type: string
      localversion:
        description: "CONFIG_LOCALVERSION (must match installed module vermagic)"
        default: "-HyperOS3-A16-Sky-Developers"
        type: string
      with_ksu:
        description: "Integrate SukiSU+KPM (set false for a vanilla boot test)"
        default: "true"
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --force || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache clang flex git \
            libc6-dev libelf-dev libncurses5-dev libncurses-dev \
            libssl-dev lld llvm zip curl wget unzip \
            python3 python-is-python3 cpio \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          clang --version | head -2 || true

      - name: Clone kernel source (HuTao77 thyme 16.0 / 4.19.325)
        run: |
          git clone --depth=1 -b 16.0 \
            https://github.com/HuTao77-Studio/android_kernel_xiaomi_thyme.git kernel
          cd kernel
          echo "=== strip localversion-cip / -st (scripts/setlocalversion appends them) ==="
          ls -la localversion-* 2>/dev/null || true
          rm -f localversion-cip localversion-st
          echo "=== HEAD ==="
          git log -1 --format="%H %cd %s"
          echo "=== Version ==="
          head -6 Makefile
          echo "=== defconfig ==="
          ls -la arch/arm64/configs/thyme_defconfig
          echo "=== base key configs ==="
          grep -E "CONFIG_(LOCALVERSION|MODVERSIONS|MODULE_SIG|CGROUP_BPF|IKCONFIG)" arch/arm64/configs/thyme_defconfig
          echo "=== cgroup.c structure ==="
          grep -n "purge_effective_progs\|update_effective_progs" kernel/bpf/cgroup.c | head -8

      - name: Download toolchain (AOSP LLVM clang r547379 = same as M13)
        run: |
          set -e
          mkdir -p "$HOME/tc" && cd "$HOME/tc"
          echo "=== trying android.googlesource.com ==="
          curl -fsSL --retry 3 --max-time 600 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz" \
            -o clang.tar.gz || \
          curl -fsSL --retry 3 --max-time 600 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-release/clang-r547379.tar.gz" \
            -o clang.tar.gz
          ls -la clang.tar.gz
          mkdir -p clang && tar -xzf clang.tar.gz -C clang
          export PATH="$HOME/tc/clang/bin:$PATH"
          clang --version | head -3
          ld.lld --version | head -1

      - name: Patch vendor hooks build
        run: |
          cd kernel
          ls -la drivers/android/vendor_hooks.c 2>/dev/null || echo "(no vendor_hooks.c)"
          if [ -f drivers/android/vendor_hooks.c ] && ! grep -q "vendor_hooks" drivers/android/Makefile; then
            echo "obj-y += vendor_hooks.o" >> drivers/android/Makefile
            echo ">> patched vendor_hooks.o"
          fi
          tail -3 drivers/android/Makefile

      - name: Patch DRM msm_drv strnstr (2-arg call, 4.19 needs 3)
        run: |
          cd kernel
          echo "=== before ==="
          sed -n '1230,1240p' drivers/gpu/drm/msm/msm_drv.c
          sed -i 's/strnstr(dev_name(dev), "mdp")/strstr(dev_name(dev), "mdp")/' drivers/gpu/drm/msm/msm_drv.c
          echo "=== after ==="
          grep -n "strstr(dev_name" drivers/gpu/drm/msm/msm_drv.c
          echo "=== scan other suspicious 2-arg strnstr ==="
          grep -rn "strnstr(" drivers/gpu techpack 2>/dev/null | grep -vE "strnstr\([^,]+, *[^,]+, *[^)]+\)" | head -10 || true

      - name: Integrate SukiSU (manual clone, no setup.sh)
        if: ${{ inputs.with_ksu != 'false' }}
        run: |
          cd kernel
          BR="${{ inputs.ksu_branch || 'susfs_new' }}"
          [ -z "$BR" ] && BR="susfs_new"
          rm -rf KernelSU drivers/kernelsu
          git clone --depth=1 -b "$BR" https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          echo "=== repo state ==="
          git -C KernelSU log -1 --format="%H %cd %s"
          git -C KernelSU rev-parse --abbrev-ref HEAD
          echo "=== KernelSU/kernel/ ==="
          ls KernelSU/kernel/ | head -30
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          ls -la drivers/kernelsu | head -3
          echo "=== Kconfig items ==="
          grep -E "^config " drivers/kernelsu/Kconfig | awk '{print $2}' | tr '\n' ' '; echo
          echo "=== wire into Kbuild (INLINE Kconfig, source is silently ignored) ==="
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig
          sed -i '/^# --- KSU inline Kconfig start ---$/,/^# --- KSU inline Kconfig end ---$/d' drivers/Kconfig
          {
            echo ""
            echo "# --- KSU inline Kconfig start ---"
            cat drivers/kernelsu/Kconfig
            echo "# --- KSU inline Kconfig end ---"
          } >> drivers/Kconfig
          grep -n "kernelsu\|KSU inline" drivers/Kconfig drivers/Makefile | head -4
          echo "=== tail of drivers/Kconfig ==="
          tail -12 drivers/Kconfig
          echo "=== KPM sources ==="
          ls KernelSU/kernel/kpm/ 2>/dev/null | head -10 || echo "(no kpm dir)"
          echo "=== Makefile CFLAGS health check ==="
          if grep -qE "^(CFLAGS|AFLAGS)[[:space:]]*[:+]?=" drivers/kernelsu/Makefile; then
            sed -i 's/^CFLAGS[[:space:]]*:=/ccflags-y :=/; s/^CFLAGS[[:space:]]*+=/ccflags-y +=/; s/^AFLAGS[[:space:]]*:=/asflags-y :=/; s/^AFLAGS[[:space:]]*+=/asflags-y +=/' drivers/kernelsu/Makefile
            echo "patched CFLAGS -> ccflags-y"
          else
            echo "Makefile clean"
          fi
          echo "=== KPM: 4.19 access_ok() takes 3 args (type, addr, size) ==="
          if [ -f drivers/kernelsu/kpm/kpm.c ]; then
            sed -i 's/access_ok(\([^,)]*\), \([^)]*\))/access_ok(VERIFY_WRITE, \1, \2)/g' drivers/kernelsu/kpm/kpm.c
            grep -n "access_ok" drivers/kernelsu/kpm/kpm.c | head -12
          else
            echo "(no kpm.c)"
          fi

      - name: 4.19 kernel shims (MODULE_IMPORT_NS / nofault / strscpy_pad / TWA_RESUME)
        if: ${{ inputs.with_ksu != 'false' }}
        run: |
          cd kernel
          python3 - <<'PY'
          import re

          def patch(path, marker, block):
              s = open(path).read()
              if marker in s:
                  print("  already  ", path)
                  return
              if not s.endswith("\n"):
                  s += "\n"
              open(path, "w").write(s + block)
              print("  shimmed  ", path)

          MODULE_NS = '''
          /* 4.19 compat: symbol namespaces are 5.4+ */
          #ifndef MODULE_IMPORT_NS
          #define MODULE_IMPORT_NS(ns)
          #endif
          '''

          UACCESS = '''
          /* 4.19 compat: full nofault family (5.8+) */
          #ifndef strncpy_from_user_nofault
          static inline long strncpy_from_user_nofault(char *dst, const void __user *src, long count)
          {
              return strncpy_from_user(dst, src, count);
          }
          #endif
          #ifndef copy_from_kernel_nofault
          #define copy_from_kernel_nofault(dst, src, size) probe_kernel_read((dst), (const void *)(src), (size))
          #endif
          #ifndef copy_to_kernel_nofault
          #define copy_to_kernel_nofault(dst, src, size) probe_kernel_write((dst), (const void *)(src), (size))
          #endif
          #ifndef copy_from_user_nofault
          static inline long copy_from_user_nofault(void *dst, const void __user *src, size_t size)
          {
              long ret;
              if (!access_ok(VERIFY_READ, src, size))
                  return -EFAULT;
              pagefault_disable();
              ret = __copy_from_user_inatomic(dst, src, size);
              pagefault_enable();
              return ret ? -EFAULT : 0;
          }
          #endif
          #ifndef copy_to_user_nofault
          static inline long copy_to_user_nofault(void __user *dst, const void *src, size_t size)
          {
              long ret;
              if (!access_ok(VERIFY_WRITE, dst, size))
                  return -EFAULT;
              pagefault_disable();
              ret = __copy_to_user_inatomic(dst, src, size);
              pagefault_enable();
              return ret ? -EFAULT : 0;
          }
          #endif
          '''

          STRING = '''
          /* 4.19 compat: strscpy_pad is 5.1+ */
          #ifndef strscpy_pad
          static inline ssize_t strscpy_pad(char *dest, const char *src, size_t count)
          {
              ssize_t written = strscpy(dest, src, count);
              if (written < 0) {
                  if (count)
                      memset(dest, 0, count);
                  return written;
              }
              if ((size_t)written < count)
                  memset(dest + written, 0, count - written);
              return written;
          }
          #endif
          '''

          TASKWORK = '''
          /* 4.19 compat: task_work_add takes bool notify (TWA_* is 5.8+) */
          #ifndef TWA_RESUME
          #define TWA_NONE   false
          #define TWA_RESUME true
          #endif
          '''

          import os
          FORWARD = {
              "include/linux/minmax.h": "#ifndef _LINUX_MINMAX_419\n#define _LINUX_MINMAX_419\n#include <linux/kernel.h>\n#endif\n",
              "include/uapi/linux/mount.h": "#ifndef _UAPI_LINUX_MOUNT_419\n#define _UAPI_LINUX_MOUNT_419\n#include <linux/fs.h>\n#include <linux/mount.h>\n#endif\n",
          }
          for path, body in FORWARD.items():
              if os.path.exists(path):
                  print("  exists   ", path)
                  continue
              d = os.path.dirname(path)
              if d and not os.path.isdir(d):
                  os.makedirs(d)
              open(path, "w").write("/* 4.19 compat: this header is 5.x-only, forward it */\n" + body)
              print("  fwd      ", path)

          patch("include/linux/module.h", "define MODULE_IMPORT_NS", MODULE_NS)
          patch("include/linux/uaccess.h", "strncpy_from_user_nofault", UACCESS)
          patch("include/linux/string.h", "strscpy_pad", STRING)
          patch("include/linux/task_work.h", "TWA_RESUME", TASKWORK)
          PY
          echo "=== shim sanity ==="
          grep -c "MODULE_IMPORT_NS" include/linux/module.h || true
          grep -c "strncpy_from_user_nofault" include/linux/uaccess.h || true
          grep -c "TWA_RESUME" include/linux/task_work.h || true
          ls -la include/linux/minmax.h include/uapi/linux/mount.h

